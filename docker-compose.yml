version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aquasense-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aquasense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquasense-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aquasense_db
      - SECRET_KEY=aquasense_docker_production_jwt_secret_key_32_chars
      - ENVIRONMENT=production
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/generated_reports
      - backend_models:/app/trained_models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquasense-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
  backend_reports:
  backend_models:
